# .github/workflows/keep_alive.yml
name: Supabase Keep Alive

on:
  schedule:
    # This Cron expression translates to: "Run at 00:00 (midnight) every 5th day of the month"
    - cron: '0 0 */5 * *'
  workflow_dispatch: # This line adds a manual "Run" button in GitHub so you can test it immediately

jobs:
  ping-db:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Matches a standard data engineering environment
          
      - name: Install Database Drivers
        run: |
          python -m pip install --upgrade pip
          pip install sqlalchemy psycopg2-binary
          
      - name: Execute Keep-Alive Script
        env:
          # This maps your GitHub Secret to the operating system environment
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: python keep_alive.py